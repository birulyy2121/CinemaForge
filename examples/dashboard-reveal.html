<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070708; color: #f2f2f2; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    
    .grain::after {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.5; mix-blend-mode: overlay;
    }

    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10%; opacity: 0; }

    /* Dashboard Layout */
    .dashboard {
      width: 900px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(20px);
    }

    .card-wide { grid-column: span 2; }
    .card-tall { grid-row: span 2; }

    .card-label {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .card-delta {
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }

    .delta-up { color: #34d399; }
    .delta-down { color: #ef4444; }

    /* Bar chart */
    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 120px;
      margin-top: 16px;
    }

    .bar {
      flex: 1;
      background: rgba(67,211,201,0.3);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
    }

    .bar.accent { background: #43d3c9; }

    /* Ring */
    .ring-container {
      width: 100px; height: 100px;
      position: relative;
      margin: 16px auto 0;
    }

    .ring-bg, .ring-fg {
      position: absolute;
      inset: 0;
    }

    .ring-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }

    /* Title */
    .dash-title {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 48px;
      text-align: center;
    }

    .dash-title .accent { color: #43d3c9; }
  </style>
</head>

<body class="grain">
  <div id="root"
    data-composition-id="dashboard-reveal"
    data-start="0"
    data-duration="20"
    data-width="1920"
    data-height="1080"
    data-fps="60"
  >
    <!-- Title Scene -->
    <div class="scene" id="scene-title">
      <div class="dash-title" id="title">
        Your metrics.<br><span class="accent">One place.</span>
      </div>
    </div>

    <!-- Dashboard Scene -->
    <div class="scene" id="scene-dash">
      <div class="dashboard" id="dashboard">
        <!-- Revenue -->
        <div class="card" id="c1">
          <div class="card-label">Revenue</div>
          <div class="card-value" id="v1">$0</div>
          <div class="card-delta delta-up">↑ 24.3%</div>
        </div>

        <!-- Users -->
        <div class="card" id="c2">
          <div class="card-label">Active Users</div>
          <div class="card-value" id="v2">0</div>
          <div class="card-delta delta-up">↑ 12.7%</div>
        </div>

        <!-- Conversion -->
        <div class="card" id="c3">
          <div class="card-label">Conversion</div>
          <div class="card-value" id="v3">0%</div>
          <div class="card-delta delta-up">↑ 3.2%</div>
        </div>

        <!-- Chart -->
        <div class="card card-wide" id="c4">
          <div class="card-label">Weekly Performance</div>
          <div class="chart-bars" id="bars">
            <div class="bar" id="b1" style="height:0%"></div>
            <div class="bar" id="b2" style="height:0%"></div>
            <div class="bar" id="b3" style="height:0%"></div>
            <div class="bar" id="b4" style="height:0%"></div>
            <div class="bar" id="b5" style="height:0%"></div>
            <div class="bar accent" id="b6" style="height:0%"></div>
            <div class="bar accent" id="b7" style="height:0%"></div>
          </div>
        </div>

        <!-- Uptime -->
        <div class="card" id="c5">
          <div class="card-label">Uptime</div>
          <div class="ring-container">
            <svg class="ring-bg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
            </svg>
            <svg class="ring-fg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="none" stroke="#43d3c9" stroke-width="8"
                stroke-dasharray="251.3" stroke-dashoffset="251.3" id="ring"
                stroke-linecap="round" transform="rotate(-90 50 50)"/>
            </svg>
            <div class="ring-value" id="ring-val">0%</div>
          </div>
        </div>

        <!-- Latency -->
        <div class="card" id="c6">
          <div class="card-label">Avg Latency</div>
          <div class="card-value" id="v6">0ms</div>
          <div class="card-delta delta-down">↓ 38%</div>
        </div>

        <!-- Requests -->
        <div class="card" id="c7">
          <div class="card-label">Requests/s</div>
          <div class="card-value" id="v7">0</div>
          <div class="card-delta delta-up">↑ 156%</div>
        </div>

        <!-- Errors -->
        <div class="card" id="c8">
          <div class="card-label">Error Rate</div>
          <div class="card-value" id="v8">0%</div>
          <div class="card-delta delta-down">↓ 0.8%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // ─── Title (0–4s) ───
    tl.to('#scene-title', { opacity: 1, duration: 0.01 }, 0);
    tl.from('#title', { y: 50, opacity: 0, scale: 0.95, duration: 1, ease: "power4.out" }, 0.3);
    tl.to('#title .accent', { textShadow: '0 0 50px rgba(67,211,201,0.3)', duration: 0.6, ease: "power2.out" }, 1.5);
    tl.to('#scene-title', { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 3.5);

    // ─── Dashboard reveal (4–18s) ───
    tl.to('#scene-dash', { opacity: 1, duration: 0.01 }, 4);

    // Cards stagger in with spring
    const cards = ['#c1', '#c2', '#c3', '#c4', '#c5', '#c6', '#c7', '#c8'];
    cards.forEach((c, i) => {
      tl.from(c, {
        y: 60, opacity: 0, scale: 0.9,
        duration: 0.7,
        ease: "back.out(1.5)",
      }, 4.3 + i * 0.12);
    });

    // Counter: Revenue
    const rev = { v: 0 };
    tl.to(rev, { v: 847000, duration: 2, ease: "power2.out",
      onUpdate: () => document.getElementById('v1').textContent = '$' + (rev.v / 1000).toFixed(0) + 'K'
    }, 5.5);

    // Counter: Users
    const usr = { v: 0 };
    tl.to(usr, { v: 24893, duration: 2, ease: "power2.out",
      onUpdate: () => document.getElementById('v2').textContent = Math.round(usr.v).toLocaleString()
    }, 5.7);

    // Counter: Conversion
    const cnv = { v: 0 };
    tl.to(cnv, { v: 8.4, duration: 2, ease: "power2.out",
      onUpdate: () => document.getElementById('v3').textContent = cnv.v.toFixed(1) + '%'
    }, 5.9);

    // Bar chart grows
    const barHeights = [45, 62, 38, 71, 55, 85, 92];
    barHeights.forEach((h, i) => {
      tl.to(`#b${i + 1}`, { height: h + '%', duration: 0.8, ease: "back.out(1.3)" }, 7 + i * 0.1);
    });

    // Ring fill
    const ringObj = { v: 251.3 };
    tl.to(ringObj, { v: 251.3 * 0.003, duration: 2, ease: "power3.out",
      onUpdate: () => document.getElementById('ring').style.strokeDashoffset = ringObj.v
    }, 8.5);
    const ringPct = { v: 0 };
    tl.to(ringPct, { v: 99.7, duration: 2, ease: "power3.out",
      onUpdate: () => document.getElementById('ring-val').textContent = ringPct.v.toFixed(1) + '%'
    }, 8.5);

    // Counter: Latency
    const lat = { v: 850 };
    tl.to(lat, { v: 42, duration: 1.5, ease: "power2.out",
      onUpdate: () => document.getElementById('v6').textContent = Math.round(lat.v) + 'ms'
    }, 10);

    // Counter: Requests
    const req = { v: 0 };
    tl.to(req, { v: 12400, duration: 1.5, ease: "power2.out",
      onUpdate: () => document.getElementById('v7').textContent = Math.round(req.v).toLocaleString()
    }, 10.3);

    // Counter: Errors
    const err = { v: 5 };
    tl.to(err, { v: 0.2, duration: 1.5, ease: "power2.out",
      onUpdate: () => document.getElementById('v8').textContent = err.v.toFixed(1) + '%'
    }, 10.6);

    // Accent glow on key cards
    tl.to('#c1', { borderColor: 'rgba(67,211,201,0.2)', boxShadow: '0 0 30px rgba(67,211,201,0.05)', duration: 0.8, ease: "power2.out" }, 12);
    tl.to('#c5', { borderColor: 'rgba(67,211,201,0.2)', boxShadow: '0 0 30px rgba(67,211,201,0.05)', duration: 0.8, ease: "power2.out" }, 12.5);

    // Gentle scale breathe on whole dashboard
    tl.to('#dashboard', { scale: 1.02, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 14);

    // Fade to close
    tl.to('#scene-dash', { opacity: 0, scale: 0.95, duration: 0.8, ease: "power2.in" }, 18.5);

    window.__timelines = window.__timelines || {};
    window.__timelines['dashboard-reveal'] = tl;
  </script>
</body>
</html>
